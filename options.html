<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Keep — settings</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 20px 22px 22px; min-width: 380px;
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: Canvas; color: CanvasText;
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 28px; height: 28px; border-radius: 6px; }
    header b { font-size: 16px; }
    header span { opacity: .6; }
    label { display: block; font-weight: 600; margin: 0 0 6px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 8px 10px; border-radius: 8px; font: inherit;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); background: Field; color: FieldText;
    }
    button {
      padding: 8px 14px; border-radius: 8px; border: 0; font: inherit; font-weight: 600;
      background: #0c0c0c; color: #fff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { background: #fff; color: #0c0c0c; } }
    button:disabled { opacity: .5; cursor: default; }
    .hint { margin-top: 8px; font-size: 12.5px; opacity: .7; }
    .status { margin-top: 12px; min-height: 1.4em; font-weight: 500; }
    .ok { color: #1a7f37; } .bad { color: #d93025; }
    a { color: inherit; }
    kbd { font: 12px ui-monospace, monospace; padding: 1px 5px; border-radius: 4px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); }
  </style>
</head>
<body>
  <header>
    <picture>
      <source srcset="icons/logo-48-darkmode.png" media="(prefers-color-scheme: dark)" />
      <img src="icons/logo-48.png" alt="" />
    </picture>
    <b>Keep</b><span>keep.booq.cc</span>
  </header>

  <form id="form">
    <label for="key">API key</label>
    <div class="row">
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="ak2_…" />
      <button id="save" type="submit">Save</button>
    </div>
    <div class="hint">
      Create one at <a href="https://keep.booq.cc/settings/api-keys" target="_blank">keep.booq.cc → Settings → API Keys</a>.
      Then just click the toolbar icon, or press <kbd id="shortcut">⌥⇧K</kbd>.
    </div>
    <div id="status" class="status"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>
